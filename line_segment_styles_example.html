<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart.js Line Chart - Segment Styling</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 920px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 1.25rem;
    }

    .chart-wrap {
      position: relative;
      height: 460px;
    }

    .legend-note {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #1f2937;
    }
  </style>
</head>

<body>
  <section class="card">
    <div class="chart-wrap">
      <canvas id="lineSegmentChart"></canvas>
    </div>
    <div class="legend-note">
      Segmentos a cinzento mostram trechos com lacunas; segmentos vermelhos mostram quedas entre pontos consecutivos.
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const CHART_COLORS = {
      teal: 'rgb(75, 192, 192)'
    };

    const MONTHS = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const Utils = {
      months({ count }) {
        return Array.from({ length: count }, (_, index) => MONTHS[index % MONTHS.length]);
      }
    };

    const skipped = (ctx, value) => ctx.p0.skip || ctx.p1.skip ? value : undefined;
    const down = (ctx, value) => ctx.p0.parsed.y > ctx.p1.parsed.y ? value : undefined;

    const genericOptions = {
      fill: false,
      interaction: {
        intersect: false
      },
      radius: 0,
    };

    const config = {
      type: 'line',
      data: {
        labels: Utils.months({ count: 7 }),
        datasets: [{
          label: 'My First Dataset',
          data: [65, 59, NaN, 48, 56, 57, 40],
          borderColor: CHART_COLORS.teal,
          segment: {
            borderColor: ctx => skipped(ctx, 'rgb(0,0,0,0.2)') || down(ctx, 'rgb(192,75,75)'),
            borderDash: ctx => skipped(ctx, [6, 6]),
          },
          spanGaps: true
        }]
      },
      options: {
        ...genericOptions,
        responsive: true,
        plugins: {
          legend: {
            position: 'top',
          },
          title: {
            display: true,
            text: 'Chart.js Line Chart - Segment Styling'
          }
        },
        scales: {
          x: {
            display: true,
            title: {
              display: true,
              text: 'Month'
            }
          },
          y: {
            display: true,
            title: {
              display: true,
              text: 'Value'
            }
          }
        }
      }
    };

    new Chart(document.getElementById('lineSegmentChart'), config);
  </script>
</body>

</html>
