<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart.js Scatter Chart</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 920px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 1.25rem;
    }

    .chart-wrap {
      position: relative;
      height: 460px;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
    }

    button:hover {
      background: #1e293b;
    }
  </style>
</head>

<body>
  <section class="card">
    <div class="chart-wrap">
      <canvas id="scatterChart"></canvas>
    </div>
    <div class="actions" id="actions"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const CHART_COLORS = {
      red: 'rgb(255, 99, 132)',
      orange: 'rgb(255, 159, 64)',
      yellow: 'rgb(255, 205, 86)',
      green: 'rgb(75, 192, 192)',
      blue: 'rgb(54, 162, 235)',
      purple: 'rgb(153, 102, 255)',
      grey: 'rgb(201, 203, 207)'
    };

    const palette = [
      CHART_COLORS.red,
      CHART_COLORS.orange,
      CHART_COLORS.yellow,
      CHART_COLORS.green,
      CHART_COLORS.blue,
      CHART_COLORS.purple,
      CHART_COLORS.grey
    ];

    const Utils = {
      CHART_COLORS,
      transparentize(color, opacity) {
        return color.replace('rgb(', 'rgba(').replace(')', `, ${1 - opacity})`);
      },
      namedColor(index) {
        return palette[index % palette.length];
      },
      rand(min, max) {
        return Math.round(min + Math.random() * (max - min));
      },
      bubbles({ count, rmin, rmax, min, max }) {
        return Array.from({ length: count }, () => ({
          x: this.rand(min, max),
          y: this.rand(min, max),
          r: this.rand(rmin, rmax)
        }));
      }
    };

    const DATA_COUNT = 7;
    const NUMBER_CFG = { count: DATA_COUNT, rmin: 1, rmax: 1, min: 0, max: 100 };

    const data = {
      datasets: [
        {
          label: 'Dataset 1',
          data: Utils.bubbles(NUMBER_CFG),
          borderColor: Utils.CHART_COLORS.red,
          backgroundColor: Utils.transparentize(Utils.CHART_COLORS.red, 0.5),
        },
        {
          label: 'Dataset 2',
          data: Utils.bubbles(NUMBER_CFG),
          borderColor: Utils.CHART_COLORS.orange,
          backgroundColor: Utils.transparentize(Utils.CHART_COLORS.orange, 0.5),
        }
      ]
    };

    const config = {
      type: 'scatter',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'top',
          },
          title: {
            display: true,
            text: 'Chart.js Scatter Chart'
          }
        }
      },
    };

    const actions = [
      {
        name: 'Randomize',
        handler(chart) {
          chart.data.datasets.forEach(dataset => {
            dataset.data = Utils.bubbles({ count: DATA_COUNT, rmin: 1, rmax: 1, min: 0, max: 100 });
          });
          chart.update();
        }
      },
      {
        name: 'Add Dataset',
        handler(chart) {
          const chartData = chart.data;
          const dsColor = Utils.namedColor(chartData.datasets.length);
          const newDataset = {
            label: 'Dataset ' + (chartData.datasets.length + 1),
            backgroundColor: Utils.transparentize(dsColor, 0.5),
            borderColor: dsColor,
            data: Utils.bubbles({ count: DATA_COUNT, rmin: 1, rmax: 1, min: 0, max: 100 }),
          };
          chartData.datasets.push(newDataset);
          chart.update();
        }
      },
      {
        name: 'Add Data',
        handler(chart) {
          const chartData = chart.data;
          if (chartData.datasets.length > 0) {
            for (let index = 0; index < chartData.datasets.length; ++index) {
              chartData.datasets[index].data.push(Utils.bubbles({ count: 1, rmin: 1, rmax: 1, min: 0, max: 100 })[0]);
            }

            chart.update();
          }
        }
      },
      {
        name: 'Remove Dataset',
        handler(chart) {
          chart.data.datasets.pop();
          chart.update();
        }
      },
      {
        name: 'Remove Data',
        handler(chart) {
          chart.data.datasets.forEach(dataset => {
            dataset.data.pop();
          });

          chart.update();
        }
      }
    ];

    const chart = new Chart(document.getElementById('scatterChart'), config);

    const actionsEl = document.getElementById('actions');
    actions.forEach(action => {
      const button = document.createElement('button');
      button.textContent = action.name;
      button.addEventListener('click', () => action.handler(chart));
      actionsEl.appendChild(button);
    });
  </script>
</body>

</html>
