<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart.js Horizontal Bar Chart</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 920px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 1.25rem;
    }

    .chart-wrap {
      position: relative;
      height: 460px;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
    }

    button:hover {
      background: #1e293b;
    }
  </style>
</head>

<body>
  <section class="card">
    <div class="chart-wrap">
      <canvas id="horizontalBarChart"></canvas>
    </div>
    <div class="actions" id="actions"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const CHART_COLORS = {
      red: 'rgb(255, 99, 132)',
      blue: 'rgb(54, 162, 235)',
      orange: 'rgb(255, 159, 64)',
      green: 'rgb(75, 192, 192)',
      yellow: 'rgb(255, 205, 86)',
      purple: 'rgb(153, 102, 255)',
      grey: 'rgb(201, 203, 207)'
    };

    const MONTHS = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const palette = [
      CHART_COLORS.red,
      CHART_COLORS.blue,
      CHART_COLORS.orange,
      CHART_COLORS.green,
      CHART_COLORS.yellow,
      CHART_COLORS.purple,
      CHART_COLORS.grey
    ];

    const Utils = {
      CHART_COLORS,
      months({ count }) {
        return MONTHS.slice(0, count);
      },
      numbers({ count, min, max }) {
        return Array.from({ length: count }, () => this.rand(min, max));
      },
      rand(min, max) {
        return Math.round(min + Math.random() * (max - min));
      },
      transparentize(color, opacity) {
        return color.replace('rgb(', 'rgba(').replace(')', `, ${1 - opacity})`);
      },
      namedColor(index) {
        return palette[index % palette.length];
      }
    };

    const DATA_COUNT = 7;
    const NUMBER_CFG = { count: DATA_COUNT, min: -100, max: 100 };

    const labels = Utils.months({ count: 7 });
    const data = {
      labels: labels,
      datasets: [
        {
          label: 'Dataset 1',
          data: Utils.numbers(NUMBER_CFG),
          borderColor: Utils.CHART_COLORS.red,
          backgroundColor: Utils.transparentize(Utils.CHART_COLORS.red, 0.5),
        },
        {
          label: 'Dataset 2',
          data: Utils.numbers(NUMBER_CFG),
          borderColor: Utils.CHART_COLORS.blue,
          backgroundColor: Utils.transparentize(Utils.CHART_COLORS.blue, 0.5),
        }
      ]
    };

    const config = {
      type: 'bar',
      data: data,
      options: {
        indexAxis: 'y',
        elements: {
          bar: {
            borderWidth: 2,
          }
        },
        responsive: true,
        plugins: {
          legend: {
            position: 'right',
          },
          title: {
            display: true,
            text: 'Chart.js Horizontal Bar Chart'
          }
        }
      },
    };

    const actions = [
      {
        name: 'Randomize',
        handler(chart) {
          chart.data.datasets.forEach(dataset => {
            dataset.data = Utils.numbers({ count: chart.data.labels.length, min: -100, max: 100 });
          });
          chart.update();
        }
      },
      {
        name: 'Add Dataset',
        handler(chart) {
          const chartData = chart.data;
          const dsColor = Utils.namedColor(chartData.datasets.length);
          const newDataset = {
            label: 'Dataset ' + (chartData.datasets.length + 1),
            backgroundColor: Utils.transparentize(dsColor, 0.5),
            borderColor: dsColor,
            borderWidth: 1,
            data: Utils.numbers({ count: chartData.labels.length, min: -100, max: 100 }),
          };
          chartData.datasets.push(newDataset);
          chart.update();
        }
      },
      {
        name: 'Add Data',
        handler(chart) {
          const chartData = chart.data;
          if (chartData.datasets.length > 0) {
            chartData.labels = Utils.months({ count: chartData.labels.length + 1 });

            for (let index = 0; index < chartData.datasets.length; ++index) {
              chartData.datasets[index].data.push(Utils.rand(-100, 100));
            }

            chart.update();
          }
        }
      },
      {
        name: 'Remove Dataset',
        handler(chart) {
          chart.data.datasets.pop();
          chart.update();
        }
      },
      {
        name: 'Remove Data',
        handler(chart) {
          chart.data.labels.splice(-1, 1);

          chart.data.datasets.forEach(dataset => {
            dataset.data.pop();
          });

          chart.update();
        }
      }
    ];

    const chart = new Chart(document.getElementById('horizontalBarChart'), config);

    const actionsEl = document.getElementById('actions');
    actions.forEach(action => {
      const button = document.createElement('button');
      button.textContent = action.name;
      button.addEventListener('click', () => action.handler(chart));
      actionsEl.appendChild(button);
    });
  </script>
</body>

</html>
